name: Bug Report
description: Report a problem with Alek's Ultimate NX Edition (the Switch port)
type: Bug
body:
- type: markdown
  attributes:
    value: |
      This is an unofficial Switch port of Dusklight. Please report problems with this port here, not to the
      Dusklight team. A problem that also happens on PC Dusklight belongs to Dusklight; a problem with one mod that
      also happens on PC belongs to that mod's author.

- type: input
  id: port-version
  attributes:
    label: Port Version
    description: Shown on the main menu and in hbmenu/Sphira
    placeholder: ex. 1.0.0
  validations:
    required: true

- type: textarea
  id: bug-description
  attributes:
    label: Bug Description
    placeholder: Describe the bug you are encountering
  validations:
    required: true

- type: textarea
  id: repro-steps
  attributes:
    label: Steps to Reproduce
    placeholder: |
      1. Load save
      2. Go to Hyrule Field
      3. See bug

- type: textarea
  id: expected-behavior
  attributes:
    label: Expected Behavior
    placeholder: Describe what should be happening

- type: textarea
  id: current-behavior
  attributes:
    label: Current Behavior
    placeholder: Describe what is happening instead

- type: dropdown
  id: play-mode
  attributes:
    label: How You Play
    options:
    - Docked
    - Handheld
    - Flip Grip
  validations:
    required: true

- type: dropdown
  id: game-disc
  attributes:
    label: Game Disc
    description: The game disc you are playing on
    options:
    - GameCube NTSC-U (North America)
    - GameCube PAL (Europe)
    - GameCube NTSC-J (Japan)
    - Wii NTSC-U (North America) Revision 0
    - Wii NTSC-U (North America) Revision 2
    - Wii PAL (Europe)
    - Wii NTSC-J (Japan)
  validations:
    required: true

- type: input
  id: game-language
  attributes:
    label: Game Language
    description: The language you are playing the game in
    placeholder: ex. English, Spanish, etc.

- type: dropdown
  attributes:
    label: Graphics Backend
    options:
    - deko3d (default)
    - Vulkan
    - Unsure
    default: 0

- type: textarea
  id: texture-packs-mods
  attributes:
    label: Texture Packs and Mods
    placeholder: List any texture packs or mods you had installed, with their versions

- type: upload
  id: logs-upload
  attributes:
    label: Logs and Other Files
    description: |
      The newest log from sdmc:/switch/dusklight/cache/logs/, and if the game crashed, the newest file in
      sdmc:/atmosphere/crash_reports/

- type: textarea
  id: additional-context
  attributes:
    label: Additional Context
    placeholder: Any other information that might be helpful
