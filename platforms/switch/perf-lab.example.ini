# Dusklight perf-lab.ini -- developer-mode A/B switches (V1-rc16).
# Copy to sdmc:/switch/dusklight/perf-lab.ini and remove the '#' of the line to try. Without the file
# (or with every line commented out) each value below is the default. Only read in developer mode.
# One A/B at a time: play the same 1-2 minute route with and without, and send both session logs.

# ---- deko3d renderer: read once at start-up, a change needs a relaunch. All OFF by default.
# Staging slots CPU-cached. Try it together with fifo_fast = urep (uniforms built in place).
# dk_cached_upload = 1
# fifo_fast = urep
# The present's colour clear left out when the picture covers the whole image.
# dk_skip_present_clear = 1
# The queue's zcull. Watch for decals (footprints, shadows on the ground) losing small square tiles.
# dk_zcull = 1
# Hardware compression of colour render targets.
# dk_compression = 1

# ---- GPU timing: auto writes GPU timestamps only while something reads them (benchmark/tour, stress,
# DRS Auto); always writes them every frame (the heartbeat's gpu= value); off never.
# gpu_timing = auto

# ---- Hooks and pacing (rc16)
# The hook dispatcher's slot cache (on by default; 0 = the rc15 lookup).
# hook_fast = 0
# A late frame shows at the next refresh instead of two later (off by default).
# vsync_relaxed = 1
